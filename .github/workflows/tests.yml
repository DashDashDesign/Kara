# Runs `npm test` on every pull request and every push to main, on the oldest and a recent Node.
# Read-only on purpose: no secrets, no write access, so a pull request from a stranger cannot do harm here.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
