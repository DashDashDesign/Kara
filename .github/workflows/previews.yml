# Thumbnails made on Magnific: when tools/magnific-previews.json arrives on main, GitHub downloads them,
# makes them smaller, lists them in public/previews and pushes the result (the online app then updates).
# Nothing to run on a computer.
name: Import thumbnails
on:
  push:
    branches: [main]
    paths: [tools/magnific-previews.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ImageMagick, to make the pictures smaller
        run: command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
      - name: Download and list the thumbnails
        run: node tools/previews.js --import
      - name: Push them
        run: |
          git config user.name "Kara"
          git config user.email "previews@kara.local"
          git add -A public/previews tools
          git diff --cached --quiet && exit 0
          git commit -m "Preview images (imported by GitHub)"
          git push origin HEAD:main
