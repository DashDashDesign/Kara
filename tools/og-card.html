<!doctype html><html><head><meta charset="utf-8">
<!-- Source of public/og.png (the card shown when the link is shared). 1200 x 630.
     Regenerate: chrome --headless=new --hide-scrollbars --allow-file-access-from-files --window-size=1200,630 --virtual-time-budget=8000 --screenshot=<absolute path>/public/og.png file:///<absolute path>/tools/og-card.html
     Needs docs/kara-sheet.jpg (2400 x 1500) and public/icons/kara-k.svg. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;background:#0a0a0a;overflow:hidden}
.card{position:relative;width:1200px;height:630px;font-family:'Barlow Condensed',sans-serif;color:#f5f5f0}
.left{position:absolute;left:0;top:0;width:520px;height:630px;padding:64px 0 72px 64px;display:flex;flex-direction:column;justify-content:space-between}
.brand{font-weight:900;font-size:120px;line-height:1;letter-spacing:.01em;white-space:nowrap}
.brand img{display:inline-block;height:.7064em;width:.56em;margin-right:.042em;vertical-align:baseline}
h1{font-weight:900;font-size:84px;line-height:1;text-transform:uppercase}
h1 span{color:#3ecf60}
.right{position:absolute;right:0;top:0;width:680px;height:630px}
.shot{position:absolute;top:0;height:630px;background:url("../docs/kara-sheet.jpg") no-repeat;background-size:1929px auto}
.front{left:0;width:355px;background-position:-792px -275px}
.face{left:355px;width:325px;background-position:-1548px -275px;border-left:4px solid #0a0a0a}
</style></head><body><div class="card">
<div class="left">
  <div class="brand"><img src="../public/icons/kara-k.svg" alt="">ARA</div>
  <h1>Open source<br><span>character<br>designer</span></h1>
</div>
<div class="right"><div class="shot front"></div><div class="shot face"></div></div>
</div></body></html>
